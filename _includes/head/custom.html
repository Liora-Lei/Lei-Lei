{% include base_path %}

<!-- start custom head snippets -->

<!-- ===========================================================
     AcademicPages Custom Head Section
     =========================================================== -->

<!-- Support for Academicons -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<!-- favicon from https://commons.wikimedia.org/wiki/File:OOjs_UI_icon_academic-progressive.svg -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="icon" href="/images/favicon.ico"/>
<meta name="theme-color" content="#ffffff"/>

<!-- ===========================================================
     ✅ Custom CSS overrides — 全站加宽 + 间距优化 + 主页 sidebar 加宽
     =========================================================== -->
<style>
/* ==========================================================================
   AcademicPages / Minimal Mistakes — 全局页面加宽样式
   ========================================================================== */

/* 外层容器整体加宽并居中 */
.page,
.page__inner-wrap,
.layout--single .page,
.layout--single .page__inner-wrap,
.layout--single .page__content {
  max-width: 1100px !important;   /* 默认约740px，可改900–1200px */
  margin-left: auto !important;
  margin-right: auto !important;
  padding-left: 1.5rem !important;
  padding-right: 1.5rem !important;
}

/* 正文内容加宽并优化行距 */
.page__content {
  max-width: 1100px !important;
  margin: 0 auto !important;
  line-height: 1.75;
}

/* 带作者简介或 sidebar 的页面保持一致宽度 */
.author__content,
.sidebar,
.page__meta {
  max-width: 1100px !important;
}

/* 调整标题和正文间距，让页面更舒适 */
.page__title {
  margin-bottom: 1.6em !important;
}

/* 列表和段落之间的行距 */
.page__content ul,
.page__content p {
  margin-bottom: 0.9em;
}

/* Working paper abstracts on the homepage and Research page. */
.page__content .paper-abstract {
  font-size: 0.92em;
  line-height: 1.65;
  text-align: justify;
  hyphens: auto;
}

/* Reference names use a darker blue for readability. */
.page__content .reference-links a,
.page__content .reference-links a:visited {
  color: #163b65;
}

.page__content .reference-links a:hover,
.page__content .reference-links a:focus {
  color: #0f2845;
}

/* 表格也稍微放宽一些 */
.page__content table {
  width: 100%;
  max-width: 1000px;
  margin: 1em auto;
}

/* -----------------------------------------------------------
   🌟 仅主页（layout: home）——让 sidebar 稍微更宽一点
   ----------------------------------------------------------- */
body.layout--home .sidebar {
  flex: 0 0 340px !important;   /* 可调：300–350px */
  max-width: 340px !important;
}

body.layout--home .author__content {
  max-width: 340px !important;
}

/* 让主页上 sidebar 与正文之间的间距更自然 */
body.layout--home .sidebar__right,
body.layout--home .sidebar__left {
  margin-right: 2rem;
}

/* 头像适配更宽的侧栏（可选） */
body.layout--home .author__avatar img {
  max-width: 100%;
  height: auto;
  border-radius: 10px; /* 可按需去掉 */
}

/* 响应式优化：在窄屏设备上恢复默认宽度 */
@media screen and (max-width: 900px) {
  .page,
  .page__inner-wrap,
  .layout--single .page,
  .layout--single .page__inner-wrap,
  .page__content {
    max-width: 90% !important;
    padding-left: 1rem !important;
    padding-right: 1rem !important;
  }

  /* 窄屏时 sidebar 回落为自适应宽度 */
  body.layout--home .sidebar {
    flex: 1 1 auto !important;
    max-width: none !important;
  }
}
</style>

<!-- end custom head snippets -->
